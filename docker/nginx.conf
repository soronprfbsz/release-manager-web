server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 파일 업로드 크기 제한 (10GB)
    client_max_body_size 10240M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets (exclude /api/ paths)
    location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass ${API_SERVER_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 파일 업로드를 위한 타임아웃 및 버퍼 설정 (2시간)
        proxy_read_timeout 7200s;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        client_body_timeout 7200s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass ${API_SERVER_URL}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # index.html 은 절대 캐시하지 않는다.
    #
    # 해시가 붙은 자산(js/css)은 위에서 1년 immutable 로 캐시된다. 그런데
    # index.html 까지 브라우저에 캐시되면 그 안의 옛 번들 해시를 계속 참조하고,
    # 그 번들 역시 immutable 캐시라 네트워크를 아예 타지 않는다. 결과적으로
    # 새 버전을 배포해도 사용자는 하드 리프레시 전까지 이전 화면을 계속 본다.
    # (2026-08-12 실제로 이 증상으로 수정본이 반영되지 않는 것처럼 보였다)
    # no-cache = "쓰기 전에 반드시 재검증". ETag 가 같으면 304 로 끝나 비용이 거의 없다.
    # (expires 지시어를 같이 쓰면 Cache-Control 이 중복 출력되므로 add_header 만 둔다)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
